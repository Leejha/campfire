<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모각코 펄스</title>
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface-1:   #fcfcfb;
    --text-1:      #0b0b0b;
    --text-2:      #52514e;
    --muted:       #898781;
    --grid:        #e1e0d9;
    --axis:        #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --series-1:    #2a78d6;
    --delta-good:  #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface-1:   #1a1a19;
      --text-1:      #ffffff;
      --text-2:      #c3c2b7;
      --muted:       #898781;
      --grid:        #2c2c2a;
      --axis:        #383835;
      --border:      rgba(255,255,255,0.10);
      --series-1:    #3987e5;
      --delta-good:  #0ca30c;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page);
    color: var(--text-1);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header h1 { font-size: 1.5rem; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-top: 24px;
  }
  .tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .tile .label { color: var(--text-2); font-size: 0.85rem; }
  .tile .value { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
  .tile .unit { font-size: 1rem; font-weight: 500; color: var(--text-2); margin-left: 2px; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
  }
  .card h2 { font-size: 1rem; }
  .recent-line { margin-top: 8px; font-size: 1.05rem; }
  .recent-delta { color: var(--delta-good); font-weight: 600; }
  .recent-names { color: var(--text-2); font-size: 0.9rem; margin-top: 6px; }

  details.admin { margin-top: 28px; }
  details.admin > summary {
    cursor: pointer;
    color: var(--text-2);
    font-size: 0.9rem;
    user-select: none;
  }
  .chart-scroll { overflow-x: auto; margin-top: 12px; }
  .chart-title { font-size: 0.95rem; font-weight: 600; margin-top: 16px; }
  .chart-note { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  svg text { font-family: inherit; font-variant-numeric: tabular-nums; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    padding: 8px 10px;
    font-size: 0.8rem;
    max-width: 260px;
    display: none;
    z-index: 10;
  }
  #tooltip .tt-date { font-weight: 600; }
  #tooltip .tt-count { color: var(--text-2); }
  #tooltip .tt-names { color: var(--muted); margin-top: 2px; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 0.85rem;
  }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  th { color: var(--text-2); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  td.names { color: var(--text-2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>모각코 펄스</h1>
    <div class="sub" id="period"></div>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="card" id="recent"></section>

  <details class="admin" id="admin">
    <summary>운영자 뷰 — 참여 추이 · 베이스라인</summary>
    <div class="card">
      <div class="chart-title">세션별 참여 인원</div>
      <div class="chart-note" id="baseline-note"></div>
      <div class="chart-scroll"><div id="chart"></div></div>
      <div class="chart-title" style="margin-top:24px">전체 세션 기록</div>
      <div style="overflow-x:auto"><table id="session-table"></table></div>
    </div>
  </details>
</div>
<div id="tooltip"></div>

<script src="baseline.js"></script>
<script>
(function () {
  const data = window.PULSE_DATA;
  if (!data || !data.sessions || !data.sessions.length) {
    document.getElementById("tiles").innerHTML =
      '<div class="tile"><div class="label">데이터 없음</div><div class="value">-</div></div>';
    return;
  }
  const sessions = [...data.sessions].sort((a, b) => a.date.localeCompare(b.date));

  // ── 누적 집계 ──────────────────────────────
  const totalSessions = sessions.length;
  const totalAttendance = sessions.reduce((a, s) => a + s.participants.length, 0);
  const totalTasksDone = sessions.reduce(
    (a, s) => a + s.participants.reduce((x, p) => x + (p.tasksDone || 0), 0), 0);
  const people = new Set();
  sessions.forEach((s) => s.participants.forEach((p) => people.add(p.name)));

  const first = sessions[0].date, last = sessions[sessions.length - 1].date;
  const months = Math.max(1, Math.round(
    (new Date(last) - new Date(first)) / (1000 * 60 * 60 * 24 * 30.4)));

  document.getElementById("period").textContent =
    `${first.replaceAll("-", ".")} ~ ${last.replaceAll("-", ".")} · ${months}개월의 기록`;

  const tiles = [
    ["함께한 세션", totalSessions, "회"],
    ["누적 참여", totalAttendance, "명"],
    ["완료한 작업", totalTasksDone, "개"],
    ["함께한 사람", people.size, "명"],
  ];
  document.getElementById("tiles").innerHTML = tiles.map(
    ([label, value, unit]) =>
      `<div class="tile"><div class="label">${label}</div>` +
      `<div class="value">${value.toLocaleString()}<span class="unit">${unit}</span></div></div>`
  ).join("");

  // ── 최근 세션 (증가했을 때만 비교 문구, 음수 표현 금지) ──
  const latest = sessions[sessions.length - 1];
  const prev = sessions[sessions.length - 2];
  const n = latest.participants.length;
  let line = `<span style="font-weight:600">${latest.date.replaceAll("-", ".")}</span> — `;
  if (prev && n > prev.participants.length) {
    line += `<span class="recent-delta">지난 세션보다 ${n - prev.participants.length}명 더</span>, 총 ${n}명이 함께했어요`;
  } else {
    line += `${n}명이 함께했어요`;
  }
  document.getElementById("recent").innerHTML =
    `<h2>최근 세션</h2><div class="recent-line">${line}</div>` +
    `<div class="recent-names">${latest.participants.map((p) => p.name).join(" · ")}</div>`;

  // ── 운영자 뷰: 베이스라인 노트 ──────────────
  const last4 = sessions.slice(-4);
  const base = last4.reduce((a, s) => a + s.participants.length, 0) / last4.length;
  document.getElementById("baseline-note").textContent =
    `최근 4세션 평균 ${base.toFixed(1)}명 (파일럿 비교 기준점) · 막대에 마우스를 올리면 상세가 보입니다`;

  // ── 바 차트 (단일 시리즈) ──────────────────
  const css = getComputedStyle(document.documentElement);
  const C = (name) => css.getPropertyValue(name).trim();

  const barW = 10, gap = 4, padL = 34, padR = 8, padT = 12, padB = 26;
  const H = 200;
  const plotH = H - padT - padB;
  const W = padL + sessions.length * (barW + gap) + padR;
  const maxY = Math.max(...sessions.map((s) => s.participants.length));
  const yTop = Math.ceil(maxY / 2) * 2; // 짝수 눈금
  const y = (v) => padT + plotH * (1 - v / yTop);

  let svg = `<svg width="${W}" height="${H}" role="img" aria-label="세션별 참여 인원 막대 차트">`;

  // 가로 그리드 + y 라벨
  for (let v = 0; v <= yTop; v += 2) {
    svg += `<line x1="${padL}" y1="${y(v)}" x2="${W - padR}" y2="${y(v)}" stroke="${C("--grid")}" stroke-width="1"/>`;
    svg += `<text x="${padL - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="${C("--muted")}">${v}</text>`;
  }

  // 막대 (윗모서리만 4px 라운드, 베이스라인에 붙임)
  sessions.forEach((s, i) => {
    const v = s.participants.length;
    const x = padL + i * (barW + gap);
    const top = y(v), bot = y(0);
    const h = bot - top;
    const r = Math.min(4, barW / 2, h);
    svg += `<path d="M${x},${bot} L${x},${top + r} Q${x},${top} ${x + r},${top} ` +
           `L${x + barW - r},${top} Q${x + barW},${top} ${x + barW},${top + r} L${x + barW},${bot} Z" ` +
           `fill="${C("--series-1")}"/>`;
    // 히트 영역(막대보다 넓게, 전체 높이)
    svg += `<rect data-i="${i}" x="${x - gap / 2}" y="${padT}" width="${barW + gap}" height="${plotH}" fill="transparent"/>`;
  });

  // 월 바뀔 때만 x 라벨
  let prevMonth = "";
  sessions.forEach((s, i) => {
    const m = s.date.slice(0, 7);
    if (m !== prevMonth) {
      prevMonth = m;
      const x = padL + i * (barW + gap);
      const [yy, mm] = m.split("-");
      svg += `<text x="${x}" y="${H - 8}" font-size="10" fill="${C("--muted")}">${mm === "01" || i === 0 ? yy.slice(2) + "." : ""}${Number(mm)}월</text>`;
    }
  });

  // 베이스라인(축)
  svg += `<line x1="${padL}" y1="${y(0)}" x2="${W - padR}" y2="${y(0)}" stroke="${C("--axis")}" stroke-width="1"/>`;
  svg += `</svg>`;
  document.getElementById("chart").innerHTML = svg;

  // ── 툴팁 ──────────────────────────────────
  const tooltip = document.getElementById("tooltip");
  document.getElementById("chart").addEventListener("mousemove", (e) => {
    const t = e.target.closest("rect[data-i]");
    if (!t) { tooltip.style.display = "none"; return; }
    const s = sessions[Number(t.dataset.i)];
    tooltip.innerHTML =
      `<div class="tt-date">${s.date.replaceAll("-", ".")}</div>` +
      `<div class="tt-count">${s.participants.length}명 참여</div>` +
      `<div class="tt-names">${s.participants.map((p) => p.name).join(", ")}</div>`;
    tooltip.style.display = "block";
    const pad = 12;
    let tx = e.clientX + pad, ty = e.clientY + pad;
    const r = tooltip.getBoundingClientRect();
    if (tx + r.width > innerWidth - 8) tx = e.clientX - r.width - pad;
    if (ty + r.height > innerHeight - 8) ty = e.clientY - r.height - pad;
    tooltip.style.left = tx + "px";
    tooltip.style.top = ty + "px";
  });
  document.getElementById("chart").addEventListener("mouseleave", () => {
    tooltip.style.display = "none";
  });

  // ── 테이블 (접근성 겸 상세 뷰) ──────────────
  const rows = [...sessions].reverse().map((s) =>
    `<tr><td class="num">${s.date}</td><td class="num">${s.participants.length}</td>` +
    `<td class="names">${s.participants.map((p) => p.name).join(", ")}</td></tr>`
  ).join("");
  document.getElementById("session-table").innerHTML =
    `<thead><tr><th>날짜</th><th>인원</th><th>참여자</th></tr></thead><tbody>${rows}</tbody>`;
})();
</script>
</body>
</html>
